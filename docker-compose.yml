services:
  postgres:
    image: postgres:16-alpine
    container_name: novamesh_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-lanjut}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-lanjut}
      - POSTGRES_DB=${POSTGRES_DB:-lanjut}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lanjut}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: novamesh_ai
    restart: unless-stopped
    ports:
      - "${AI_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: novamesh_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    environment:
      - PORT=5001
      - AI_SERVICE_URL=http://ai:8000
      - DATABASE_URL=postgres://${POSTGRES_USER:-lanjut}:${POSTGRES_PASSWORD:-lanjut}@postgres:5432/${POSTGRES_DB:-lanjut}?sslmode=disable
      - MAGIC_TOKEN_HMAC_SECRET=${MAGIC_TOKEN_HMAC_SECRET}
      - BNI_API_URL=${BNI_API_URL}
      - BNI_CLIENT_ID=${BNI_CLIENT_ID}
      - BNI_CLIENT_SECRET=${BNI_CLIENT_SECRET}
      - BNI_COMPANY_CODE=${BNI_COMPANY_CODE}
      - BNI_CORPORATE_ID=${BNI_CORPORATE_ID}
      - BNI_USER_ID=${BNI_USER_ID}
    depends_on:
      ai:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novamesh_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_SERVICE_URL=http://backend:5001
    depends_on:
      - backend
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  postgres_data:
